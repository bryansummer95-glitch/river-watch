name: Fetch historical flow
on:
  push:
    paths:
      - '.github/workflows/history.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and capture diagnostics
        run: node download-history.mjs 2>&1 | tee history-download.log
        continue-on-error: true
      - name: Save candidate results on a review branch
        run: |
          git switch -c history-review-2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history-download.log
          if test -f history.json; then git add history.json; fi
          git commit -m 'Record candidate River Watch history'
          git push origin history-review-2
      - name: Confirm a complete download
        run: test -s history.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-watch-history
          path: |
            history.json
            history-raw/
