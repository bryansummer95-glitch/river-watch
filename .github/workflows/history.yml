name: Fetch historical flow
on:
  push:
    paths:
      - '.github/workflows/history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node download-history.mjs
      - run: cat history.json
      - uses: actions/upload-artifact@v4
        with:
          name: river-watch-history
          path: |
            history.json
            history-raw/
