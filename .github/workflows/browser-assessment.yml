name: Browser assessment checks
on:
  push:
    paths: ['.github/workflows/browser-assessment.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright && npx playwright install chromium
      - name: Check the five assessment questions in Chromium
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS' > evidence/browser.txt 2>&1
          import {chromium} from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          page.on('console',m => {if(m.type()==='error') console.log('Browser error:',m.text())});
          const checks = [
            [ "What is tonight's plan?", /Tonight’s plan/ ],
            [ "Why is Fermoy at that level?", /Fermoy · tonight/ ],
            [ "What if the Suir at Clonmel reaches 150 m³/s?", /What-if plan/ ],
            [ "Which town should be first in line for a flood-defence study?", /Flood-defence study priority/ ],
            [ "Will my house in Mallow flood tonight?", /outside River Watch’s scope/ ]
          ];
          try {
            const {floodUrl,parseSheet} = await import('./plan.mjs');
            const {sheetUrl} = await import('./config.mjs');
            const sheetSource = new URL(sheetUrl);
            const gid = sheetSource.searchParams.get('gid');
            const csv = await (await fetch(sheetSource.origin + sheetSource.pathname.replace(/edit$/, 'export') + '?format=csv&gid=' + gid)).text();
            const sheet = parseSheet(csv);
            console.log('LIVE SHEET CELLS', 'Clonmel I2', sheet.Clonmel.flow_override_m3s, 'Fermoy J3', sheet.Fermoy.warning_override);
            if (sheet.Clonmel.flow_override_m3s || sheet.Fermoy.warning_override) throw Error('Sheet overrides have not both been cleared');
            const sheetPage = await browser.newPage({viewport:{width:1600,height:900}});
            try {
              await sheetPage.goto(sheetUrl,{waitUntil:'domcontentloaded',timeout:15000});
              await sheetPage.waitForTimeout(2500);
              await sheetPage.screenshot({path:'evidence/sheet-restored.png'});
            } catch (error) {console.log('Sheet screenshot:',error.message)}
            finally {await sheetPage.close()}
            const reference = await (await fetch(floodUrl('Fermoy'))).json();
            const today = new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Dublin',year:'numeric',month:'2-digit',day:'2-digit'}).format();
            const dates = Array.from({length:3},(_,i)=>new Date(Date.parse(today)+86400000*i).toISOString().slice(0,10));
            const sourceValues = dates.map(date=>reference.daily.river_discharge[reference.daily.time.indexOf(date)]);
            if (sourceValues.some(value=>!Number.isFinite(value))) throw Error('Fermoy source did not return complete forecast');
            const peak = Math.max(...sourceValues);
            const warn = await (await fetch('https://www.met.ie/Open_Data/json/warning_IRELAND.json')).json();
            console.log('PRE-ANSWER Fermoy dates and values',dates,sourceValues,'peak',peak,'active feed items',warn.length);
            console.log('PRE-ANSWER Clonmel scenario: 150 exceeds P99 107.88; target Barriers if Sheet stock is available');
            console.log('PRE-ANSWER study: Ennis has 17 runs; 9 in the last four winters and 7 in the first four');
            console.log('PRE-ANSWER household question: council area office referral');
            await page.goto('https://bryansummer95-glitch.github.io/river-watch/',{waitUntil:'domcontentloaded'});
            for (const [i, [question, expected]] of checks.entries()) {
              console.log('QUESTION', question, 'EXPECTED', expected);
              await page.locator('#question').fill(question);
              await page.locator('#submit').click();
              await page.waitForFunction(() => !document.querySelector('#submit').disabled,{},{timeout:45000});
              const answer = await page.locator('#answer').innerText();
              if (i === 0) {
                console.log('RESTORED BASELINE MATCH', !answer.includes('Sheet rehearsal'));
                console.log('CLONMEL CREW MATCH',answer.includes('Clonmel crew · Clonmel'));
              }
              if (i === 1) {
                const displayedPeak = Number(answer.split('Live forecast · ')[1]?.split(' ')[0]);
                console.log('INDEPENDENT FERMOY PEAK MATCH',displayedPeak === Number(peak.toFixed(2)));
              }
              if (i === 2) console.log('CLONMEL BARRIERS MATCH',answer.includes('Clonmel · Barriers'));
              if (i === 3) console.log('STUDY FIGURES MATCH',answer.includes('Ennis · 17 events. Last four winters: 9; first four: 7.'));
              console.log('MATCH', expected.test(answer), '\n', answer);
              await page.screenshot({path:'evidence/question-' + (i+1) + '.png',fullPage:true});
            }
          } catch (error) {console.log(error.message)}
          finally {await browser.close()}
          JS
          python - <<'PY' > evidence/clonmel-p99.txt
          import json, statistics, urllib.request
          saved = json.load(open('history.json'))['towns']['Clonmel']
          with urllib.request.urlopen(saved['source'], timeout=30) as stream:
              daily = json.load(stream)['daily']['river_discharge']
          p99 = statistics.quantiles(daily, n=100, method='inclusive')[98]
          print('Daily records:', len(daily))
          print('Independent Python inclusive P99:', p99, 'm³/s')
          print('Saved P99:', saved['p99'], 'm³/s')
          assert abs(p99 - saved['p99']) < 1e-9
          PY
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-watch-restored-baseline
          path: evidence/
      - name: Make text evidence available for review
        if: always()
        run: |
          git switch -c sheet-reset-check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' 'https://github.com/bryansummer95-glitch/river-watch/actions/runs/'"$GITHUB_RUN_ID" > evidence/actions-run.txt
          git add evidence/*.txt
          git commit -m 'Record browser and independent percentile checks'
          git push origin sheet-reset-check
